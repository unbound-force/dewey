---
# Reusable workflow: decides whether a run needs the expensive CI jobs.
#
# Outputs code == 'false' only for a pull request whose changed files are
# all regular files under .uf/dewey/learnings/ (Dewey learnings PRs); see
# scripts/detect-learnings-only.sh. Callers gate their jobs on it with a
# job-level `if:`, never with workflow-level `paths-ignore`, and the
# `CI OK` job in ci.yml fails if this job did not succeed.
name: Learnings-only check

on:
  workflow_call:
    outputs:
      code:
        description: "'true' when the run must execute the full CI jobs"
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # Pull requests check out refs/pull/N/merge: the commit CI tests.
      # Two commits of history give its base parent (HEAD^1).
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test detector
        if: github.event_name == 'pull_request'
        run: bash scripts/detect-learnings-only_test.sh

      - name: Detect files outside .uf/dewey/learnings/
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Only pull requests can skip. Pushes (main) run everything.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is $EVENT_NAME: full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail closed unless HEAD is the merge of the PR head into base.
          parent=$(git rev-parse --verify --quiet 'HEAD^2^{commit}') || {
            echo "::error::HEAD is not the pull request merge commit"
            exit 1
          }
          if [ "$parent" != "$HEAD_SHA" ]; then
            echo "::error::merge commit parent $parent is not PR head $HEAD_SHA"
            exit 1
          fi

          # --no-renames lists both sides of a rename, so moving a source
          # file into the learnings directory still counts as code.
          code=$(git diff --raw --no-renames 'HEAD^1' HEAD \
            | bash scripts/detect-learnings-only.sh)
          case "$code" in
            true | false) ;;
            *) echo "::error::unexpected detector output: $code"; exit 1 ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
