_extends: .github

repository:
  has_wiki: true

# main's required check ("CI OK", not strict) lives in unbound-force/.github's
# safe-settings (repos/dewey.yml); the org code-repos ruleset requires the
# code owner's approval. protection: null has the Settings app remove the
# classic branch protection. The block that was here was stale: it said
# build-and-test with strict: true, while main had been changed to CI OK.
branches:
  - name: main
    protection: null
