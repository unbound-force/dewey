---
# Reusable workflow: decides whether a run needs the expensive CI jobs.
#
# Outputs code == 'true' unless the run is a pull request whose changed
# files are ALL under .uf/dewey/learnings/ (Dewey learnings PRs). Callers
# gate their jobs on it with a job-level `if:`, never with workflow-level
# `paths-ignore`: a job skipped by its `if:` still reports its check as
# passing, while a workflow that never starts leaves a required check
# "Expected — Waiting for status to be reported" forever.
#
# The caller's job must grant `pull-requests: read` so the file list can
# be read from the API.
name: Learnings-only check

on:
  workflow_call:
    outputs:
      code:
        description: "'true' when the run must execute the full CI jobs"
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect files outside .uf/dewey/learnings/
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          # Only pull requests can skip. Pushes (main) run everything.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is $EVENT_NAME: full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The files API lists at most 3000 files; past that the list is
          # incomplete, so don't trust it.
          if [ "${CHANGED_FILES:-0}" -gt 3000 ]; then
            echo "$CHANGED_FILES changed files exceeds the API limit: full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both sides of a rename count: moving a source file into the
          # learnings directory still deletes it from the code tree.
          files=$(gh api --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')

          if [ -z "$files" ]; then
            echo "No changed files reported: full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outside=$(printf '%s\n' "$files" \
            | grep -v '^\.uf/dewey/learnings/' || true)

          if [ -n "$outside" ]; then
            echo "Files outside .uf/dewey/learnings/: full CI."
            printf '%s\n' "$outside" | head -n 20
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Every changed file is a Dewey learning: skipping CI jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
