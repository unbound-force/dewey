version: 2

project_name: dewey

builds:
  - binary: dewey
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

nfpms:
  - id: dewey
    package_name: dewey
    vendor: Unbound Force
    homepage: "https://github.com/unbound-force/dewey"
    maintainer: "Unbound Force <team@unboundforce.dev>"
    description: >-
      Knowledge graph MCP server with persistence, semantic
      search, and pluggable content sources
    license: MIT
    formats:
      - rpm
    bindir: /usr/bin

homebrew_casks:
  - name: dewey
    description: "Knowledge graph MCP server with persistence, semantic search, and pluggable content sources"
    homepage: "https://github.com/unbound-force/dewey"
    directory: Casks
    # skip_upload: true: GoReleaser writes the cask to dist/ (a release
    # asset); jflowers/ship's go-release.yml sets its darwin sha256s to the
    # signed archives', audits it and pushes it to the tap.
    skip_upload: true
    dependencies:
      - cask: ollama-app
    # custom_block, not hooks: GoReleaser renders hooks as a `postflight do`
    # block, which Homebrew deprecates (a hard error after 2027-12-11);
    # postflight_steps isn't in its DSL yet (goreleaser/goreleaser#6873).
    # Homebrew 7's postflight_steps needs a literal {{staged_path}}; the
    # backticks stop GoReleaser templating it.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/dewey"]
        end
      end
    repository:
      owner: unbound-force
      name: homebrew-tap

release:
  prerelease: auto
  extra_files:
    - glob: dist/homebrew/Casks/dewey.rb

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
